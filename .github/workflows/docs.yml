name: Documentation

# ONE workflow, correct in both repos:
#   - Build runs everywhere (every push/PR) as a compile check.
#   - Deploy runs ONLY on the public repo (NVIDIA-Omniverse/omniverse-performance),
#     guarded by the `github.repository` gate on the deploy job.
# On the internal source repo the deploy job is skipped, so nothing is published
# there -- the live Pages site is served only from the public repo.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install docs dependencies
        working-directory: docs
        run: uv sync --group docs

      - name: Build Sphinx HTML
        working-directory: docs
        run: uv run sphinx-build -b html . _build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    # Publish ONLY from the public repo. Skipped on the internal source repo.
    if: github.repository == 'NVIDIA-Omniverse/omniverse-performance' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
