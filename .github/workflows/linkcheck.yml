name: Check Documentation Links

# This guide is mostly pointers out to Omniverse / OpenUSD documentation, and
# those URLs move. Sphinx's linkcheck builder flags dead or redirected links so
# we catch breakage before a reader does. Runs on a schedule (every few days),
# on demand, and on pull requests that touch the docs.

on:
  schedule:
    # 06:00 UTC every Monday and Thursday.
    - cron: "0 6 * * 1,4"
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install docs dependencies
        working-directory: docs
        run: uv sync --group docs

      - name: Run Sphinx linkcheck
        working-directory: docs
        run: uv run sphinx-build -b linkcheck . _build/linkcheck

      - name: Upload linkcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkcheck-report
          path: docs/_build/linkcheck/output.txt
          retention-days: 30
